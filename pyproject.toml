[project]
name = "ai-atlas-examples"
version = "0.1.0"
description = "Small, reproducible PyTorch learning experiments"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
cuda = ["torch==2.14.1; sys_platform != 'darwin'"]
mlx = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mlx-cpu = ["mlx[cpu]==0.32.4; sys_platform == 'linux'"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

# Linux containers use the CPU build. Native macOS uses the PyPI
# wheel, which includes MPS support when supported by the machine.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
