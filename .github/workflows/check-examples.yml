name: Atlas and current learning examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test ai-atlas/test/*.test.cjs
      - run: node ai-atlas/build.mjs
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r examples/python/requirements.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python examples/python/run_all.py
      - name: Ensure generated lessons match their source
        run: |
          python lessons/generate.py
          git diff --exit-code -- ai-atlas/lesson-data.js examples/python examples/rust-burn/src/bin
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Compile current Burn examples without deprecated APIs
        run: cargo +1.98.1 build --manifest-path examples/rust-burn/Cargo.toml --bins
        env:
          RUSTFLAGS: '-D deprecated'
      - name: Run all Rust examples
        run: |
          for file in examples/rust-burn/src/bin/*.rs; do
            name=$(basename "$file" .rs)
            examples/rust-burn/target/debug/"$name"
          done
